# fly.toml app configuration file generated for flua-backend-gru on 2026-06-23T18:56:56-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flua-backend-gru'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ANTHROPIC_MODEL = 'claude-sonnet-4-5'
  ANTHROPIC_MODEL_HAIKU = 'claude-3-5-haiku-20241022'
  ANTHROPIC_MODEL_SONNET = 'claude-sonnet-4-20250514'
  APP_ENV = 'production'
  CORS_ORIGINS = 'https://flueai.io,https://www.flueai.io'
  FRONTEND_URL = 'https://flueai.io'
  OPENAI_VOICE_MODEL = 'gpt-4o-mini'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
